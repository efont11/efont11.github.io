      border: 5px solid #3498db;

  <script>
    let faceapi, detections = [], video;
    let currentExpression = { dominant: 'neutral', intensity: 0 };
    let smoothIntensity = 0;

    const emotionsCA = {
      happy: "feliç",
      sad: "trist",
      angry: "enfadat",
      surprised: "sorprès",
      disgusted: "fastiguejat",
      fearful: "espantat",
      neutral: "neutral"
    };

    const emotionsEmoji = {
      happy: "😄",
      sad: "😢",
      angry: "😠",
      surprised: "😲",
      disgusted: "🤢",
      fearful: "😱",
      neutral: "😐"
    };

    function setup() {
      createCanvas(windowWidth, windowHeight);

      video = createCapture(VIDEO);
      video.size(320, 240);
      video.hide();
      video.elt.muted = true;
      video.elt.setAttribute('playsinline', '');

      const options = {
        withLandmarks: false,
        withExpressions: true,
        withDescriptors: false
      };

      faceapi = ml5.faceApi(video, options, () => {
        document.getElementById('loading-screen').style.display = 'none';
        faceapi.detect(gotResults);
      });
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }

    function gotResults(err, results) {
      if (err) {
        console.error(err);
        document.getElementById('loading-screen').innerHTML =
          '<p style="color:red">Error! Comprova la càmera i actualitza la pàgina.</p>';
        return;
      }

      detections = results || [];

      if (detections.length > 0) {
        updateCurrentExpression();
      } else {
        currentExpression = { dominant: 'neutral', intensity: 0 };
      }

      faceapi.detect(gotResults);
    }

    function updateCurrentExpression() {
      let maxIntensity = 0;

      detections.forEach(face => {
        const expr = face.expressions;
        const dominant = Object.keys(expr).reduce((a, b) => expr[a] > expr[b] ? a : b);

        if (expr[dominant] > maxIntensity) {
          currentExpression = {
            dominant,
            intensity: expr[dominant]
          };
          maxIntensity = expr[dominant];
        }
      });
    }

    function getBackgroundColor(dominant, intensity) {
      switch (dominant) {
        case 'happy':
          return { r: 255, g: 238, b: map(intensity, 1, 0, 120, 220) };

        case 'sad':
          return {
            r: map(intensity, 1, 0, 130, 210),
            g: map(intensity, 1, 0, 170, 220),
            b: 255
          };

        case 'angry':
          return {
            r: 255,
            g: map(intensity, 1, 0, 80, 210),
            b: map(intensity, 1, 0, 70, 210)
          };

        case 'disgusted':
          return {
            r: map(intensity, 1, 0, 140, 220),
            g: 220,
            b: map(intensity, 1, 0, 90, 220)
          };

        case 'surprised':
          return { r: 255, g: 205, b: 125 };

        case 'fearful':
          return { r: 170, g: 160, b: 250 };

        default:
          return { r: 215, g: 215, b: 215 };
      }
    }

    function draw() {
      smoothIntensity = lerp(smoothIntensity, currentExpression.intensity, 0.1);

      const bg = getBackgroundColor(currentExpression.dominant, smoothIntensity);
      background(bg.r, bg.g, bg.b);

      drawHomerMood(currentExpression.dominant, smoothIntensity);

      // vídeo petit
      let vW = min(180, width * 0.22);
      let vH = vW * 0.75;
      let margin = 20;

      push();
      translate(width - vW - margin, height - vH - margin);
      stroke(255);
      strokeWeight(2);
      fill(0, 170);
      rect(-6, -6, vW + 12, vH + 12, 12);
      image(video, 0, 0, vW, vH);
      pop();

      // text superior
      fill(30, 190);
      noStroke();
      textAlign(CENTER, TOP);
      textSize(min(28, width * 0.045));

      let label = emotionsCA[currentExpression.dominant] || "neutral";
      let emoji = emotionsEmoji[currentExpression.dominant] || "😐";

      text(
        `${emoji} Sentiment detectat: ${label} (${(smoothIntensity * 100).toFixed(0)}%)`,
        width / 2,
        20
      );
    }

    // ======================================================
    // DIBUIX PRINCIPAL D'HOMER
    // ======================================================

    function drawHomerMood(mood, intensity) {
      push();

      translate(width / 2, height / 2);
      let escala = min(width / 597, height / 797) * 0.95;
      scale(escala);
      translate(-298.5, -398.5);

      // animacions globals lleus
      if (mood === 'happy') {
        let bounce = sin(frameCount * 0.14) * map(intensity, 0, 1, 0, 8);
        translate(0, bounce);
      }

      if (mood === 'fearful') {
        let shakeX = sin(frameCount * 0.9) * map(intensity, 0, 1, 0, 4);
        translate(shakeX, 0);
      }

      drawHomerBase();

      // tapem la boca antiga del dibuix base
      netejaBocaBase();

      // redibuixem el nas perquè quedi net després del “tap”
      redibuixaNas();

      switch (mood) {
        case 'happy':
          bocaFelic(intensity);
          cellesFelic(intensity);
          galtesFelic(intensity);
          break;

        case 'sad':
          bocaTrista(intensity);
          cellesTristes(intensity);
          llagrima(intensity);
          break;

        case 'angry':
          bocaEnfadada(intensity);
          cellesEnfadades(intensity);
          veinsEnfad(intensity);
          break;

        case 'surprised':
          bocaSorpresa(intensity);
          cellesSorpresa(intensity);
          break;

        case 'disgusted':
          bocaDisgust(intensity);
          cellesDisgust(intensity);
          break;

        case 'fearful':
          bocaPor(intensity);
          cellesPor(intensity);
          suorPor(intensity);
          break;

        default:
          bocaNeutral(intensity);
          cellesNeutral(intensity);
          break;
      }

      pop();
    }

    // ======================================================
    // BOQUES D'OLAF
    // ======================================================

    function bocaNeutral(intensity) {
      noFill();
      stroke(120, 90, 60);
      strokeWeight(5);
      line(276, 211, 348, 211);
    }

    function bocaFelic(intensity) {
      noFill();
      stroke(120, 90, 60);
      strokeWeight(6);

      let h = map(intensity, 0, 1, 10, 28);
      arc(310, 205, 90, h * 2, 0, PI);

      noStroke();
      fill(170, 40, 60, 120);
      arc(310, 216, 50, map(intensity, 0, 1, 8, 18), 0, PI);
    }

    function bocaTrista(intensity) {
      noFill();
      stroke(120, 90, 60);
      strokeWeight(6);

      let h = map(intensity, 0, 1, 12, 25);
      arc(310, 228, 88, h * 2, PI, TWO_PI);
    }

    function bocaEnfadada(intensity) {
      noFill();
      stroke(120, 90, 60);
      strokeWeight(6);

      let d = map(intensity, 0, 1, 0, 8);

      beginShape();
      vertex(272, 211);
      vertex(292, 205 - d * 0.2);
      vertex(311, 217 + d * 0.3);
      vertex(330, 206 - d * 0.2);
      vertex(349, 211);
      endShape();
    }

    function bocaSorpresa(intensity) {
      fill(120, 40, 50);
      stroke(120, 90, 60);
      strokeWeight(5);

      let w = map(intensity, 0, 1, 16, 30);
      let h = map(intensity, 0, 1, 20, 42);
      ellipse(310, 214, w, h);
    }

    function bocaDisgust(intensity) {
      noFill();
      stroke(120, 90, 60);
      strokeWeight(6);

      let wobble = sin(frameCount * 0.15) * map(intensity, 0, 1, 1, 4);

      beginShape();
      vertex(272, 211);
      vertex(294, 205 + wobble);
      vertex(311, 218 - wobble);
      vertex(330, 208 + wobble);
      vertex(349, 205);
      endShape();
    }

    function bocaPor(intensity) {
      let tremble = sin(frameCount * 0.9) * map(intensity, 0, 1, 0, 1.5);

      push();
      translate(tremble, 0);
      fill(120, 35, 45);
      stroke(120, 90, 60);
      strokeWeight(5);

      let w = map(intensity, 0, 1, 18, 26);
      let h = map(intensity, 0, 1, 24, 36);
      ellipse(310, 214, w, h);
      pop();
    }

    // CELLES D'HOMER
    // ======================================================

    function cellesNeutral(intensity) {
      stroke(35);
      strokeWeight(4);
      line(251, 124, 289, 124);
      line(305, 122, 344, 124);
    }

    function cellesFelic(intensity) {
      stroke(35);
      strokeWeight(4);
      let lift = map(intensity, 0, 1, 0, 8);
      line(251, 122 - lift, 289, 124);
      line(305, 120 - lift, 344, 124);
    }

    function cellesTristes(intensity) {
      stroke(35);
      strokeWeight(4);
      let d = map(intensity, 0, 1, 0, 10);
      line(251, 122, 289, 130 + d);
      line(305, 130 + d, 344, 122);
    }

    function cellesEnfadades(intensity) {
      stroke(35);
      strokeWeight(5);
      let d = map(intensity, 0, 1, 0, 14);
      line(251, 130, 289, 118 - d);
      line(305, 118 - d, 344, 130);
    }

    function cellesSorpresa(intensity) {
      stroke(35);
      strokeWeight(4);
      noFill();

      let lift = map(intensity, 0, 1, 8, 18);
      arc(270, 118 - lift, 40, 14, PI, TWO_PI);
      arc(325, 116 - lift, 42, 14, PI, TWO_PI);
    }

    function cellesDisgust(intensity) {
      stroke(35);
      strokeWeight(4);
      line(252, 125, 289, 121);
      line(305, 120, 344, 128);
    }

    function cellesPor(intensity) {
      stroke(35);
      strokeWeight(4);
      noFill();

      let lift = map(intensity, 0, 1, 10, 20);
      arc(270, 118 - lift, 42, 16, PI, TWO_PI);
      arc(325, 116 - lift, 44, 16, PI, TWO_PI);
    }

    // ======================================================
    // EFECTES EXTRA
    // ======================================================

    function galtesFelic(intensity) {
      noStroke();
      fill(255, 160, 170, map(intensity, 0, 1, 35, 110));
      ellipse(255, 204, 18, 10);
      ellipse(360, 206, 18, 10);
    }

    function llagrima(intensity) {
      let h = sin(frameCount * 0.08) * map(intensity, 0, 1, 1, 4);

      fill(120, 180, 255, 220);
      stroke(85, 130, 220);
      strokeWeight(2);

      beginShape();
      vertex(344, 164 + h);
      bezierVertex(351, 175 + h, 349, 186 + h, 341, 191 + h);
      bezierVertex(332, 185 + h, 333, 173 + h, 344, 164 + h);
      endShape(CLOSE);
    }

    function suorPor(intensity) {
      let h = sin(frameCount * 0.08) * map(intensity, 0, 1, 1, 5);

      fill(140, 200, 255, 220);
      stroke(85, 140, 220);
      strokeWeight(2);

      beginShape();
      vertex(360, 98 + h);
      bezierVertex(368, 110 + h, 366, 122 + h, 357, 129 + h);
      bezierVertex(347, 121 + h, 349, 108 + h, 360, 98 + h);
      endShape(CLOSE);
    }

    function veinsEnfad(intensity) {
      stroke(180, 0, 0, map(intensity, 0, 1, 100, 220));
      strokeWeight(3);

      let s = map(intensity, 0, 1, 0, 6);

      line(365, 78, 373 + s, 69);
      line(373 + s, 69, 381 + s, 77);
      line(373 + s, 69, 372 + s, 58);
      line(373 + s, 69, 384 + s, 67);
